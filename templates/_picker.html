{# Mountain picker. Works as a plain form; JS just skips the button. #}
<form class="picker" method="post" action="{{ url_for('index') }}">
  <label class="picker-label" for="mountain_id">Choose a mountain</label>
  <div class="picker-row">
    <select id="mountain_id" name="mountain_id" data-picker>
      <option value="" disabled {% if not selected %}selected{% endif %}>
        Select a resort&hellip;
      </option>
      {% for region, items in regions.items() %}
        <optgroup label="{{ region }}">
          {% for m in items %}
            <option value="{{ m.id }}" {% if selected == m.id %}selected{% endif %}>
              {{ m.name }} ({{ m.state }})
            </option>
          {% endfor %}
        </optgroup>
      {% endfor %}
    </select>
    <button type="submit">Get report</button>
  </div>
</form>

<script>
  // Progressive enhancement: navigate on change, and hide the now-redundant button.
  (function () {
    var select = document.querySelector('[data-picker]');
    if (!select) return;
    var form = select.closest('form');
    form.querySelector('button').hidden = true;
    select.addEventListener('change', function () {
      if (select.value) window.location.href = '/mountain/' + select.value;
    });
  })();
</script>
